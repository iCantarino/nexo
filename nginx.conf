# =====================================================================
# Nginx — Nexo UI
# - Serve os arquivos estáticos do frontend (React SPA)
# - Faz proxy reverso das chamadas /api/ para o backend
# =====================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # ----------------------------------------------------------------
    # Proxy reverso para a API
    # ----------------------------------------------------------------
    location /api/ {
        proxy_pass http://nexo-api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }

    # ----------------------------------------------------------------
    # Health check (encaminha para a API)
    # ----------------------------------------------------------------
    location /health {
        proxy_pass http://nexo-api:8000/health;
        proxy_set_header Host $host;
    }

    # ----------------------------------------------------------------
    # Arquivos estáticos do frontend com cache
    # ----------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ----------------------------------------------------------------
    # SPA fallback — qualquer rota não encontrada vai para index.html
    # para que o React Router possa resolvê-la
    # ----------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}